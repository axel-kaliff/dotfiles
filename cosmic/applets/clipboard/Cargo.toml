[package]
name = "pneuma-clipboard"
description = "Clipboard history: a capture watcher, a searchable picker overlay, and its panel button"
version.workspace = true
edition.workspace = true
license.workspace = true

# The picker is a session daemon rather than part of the applet: an applet's Wayland connection
# goes to the panel's embedded server, which cannot host a layer surface.
[[bin]]
name = "pneuma-clipboard-picker"
path = "src/bin/picker.rs"

[[bin]]
name = "pneuma-applet-clipboard"
path = "src/bin/applet.rs"

[dependencies]
libcosmic.workspace = true
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
jiff = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
