[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = ["f"]
run  = "plugin smart-filter"
desc = "Smart filter"

# Persistent filter: narrows the list and stays applied, so selections and
# file operations act on the filtered set (unlike smart-filter, which is
# for jumping/opening). Esc clears it.
[[mgr.prepend_keymap]]
on   = "F"
run  = "filter --smart"
desc = "Filter directory (persistent)"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = 'shell "fish" --block'
desc = "Open fish here"

# Shadows the default "find previous" (N after / does the same thing)
[[mgr.prepend_keymap]]
on   = "?"
for  = "unix"
run  = 'shell "glow -p ~/.config/yazi/cheatsheet.md" --block'
desc = "Show keybinding cheatsheet"

# Session (tab-session plugin) -- restore saved tabs and adopt the session
# here (arms continuous autosave); yazi-session runs this on launch
[[mgr.prepend_keymap]]
on   = ["P", "P"]
run  = "plugin tab-session"
desc = "Restore tab session"

# Bookmarks
[[mgr.prepend_keymap]]
on   = ["g", "d"]
run  = "cd ~/dotfiles"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on   = ["g", "p"]
run  = "cd ~/Projects"
desc = "Go to projects"

[[mgr.prepend_keymap]]
on   = ["g", "c"]
run  = "cd ~/.config"
desc = "Go to config"

[[mgr.prepend_keymap]]
on   = ["g", "D"]
run  = "cd ~/Downloads"
desc = "Go to downloads"

[[mgr.prepend_keymap]]
on   = ["g", "o"]
run  = "cd ~/Documents"
desc = "Go to documents"
