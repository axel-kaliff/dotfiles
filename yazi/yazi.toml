[mgr]
sort_dir_first = true
show_symlink = true
linemode = "size"
scrolloff = 5

[plugin]
prepend_fetchers = [
  # git status column
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
  # mime by extension: skips the expensive `file` probe on known extensions
  { url = "local://*", run = "mime-ext.local", prio = "high", group = "mime" },
  { url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },
]

# Scrubbing preview for video: cycles 10 frames across the timeline.
# Vendored from nbaud/yazi-video-timeline -- NOT tracked by `ya pkg upgrade`.
prepend_previewers = [
  { mime = "video/*", run = "video-timeline" },
]

[preview]
max_width = 600
max_height = 900
image_filter = "lanczos3"
# Skip sending thumbnail data for files you scroll straight past.
image_delay = 100

[opener]
# Placeholders are %s (all selected paths) and %d1 (dirname of the first).
# Shell-style "$@" / "$0" are NOT expanded by yazi -- they reach `sh` with no
# positional args and vanish, launching the command with no file at all.
edit = [
  { run = 'nvim %s', block = true, for = "unix" },
]
reveal = [
  { run = 'xdg-open %d1', for = "linux" },
]
play = [
  { run = 'mpv %s', orphan = true, for = "unix" },
]

[open]
prepend_rules = [
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  { url = "*.md", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.kdl", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.fish", use = "edit" },
  { url = "*.sh", use = "edit" },
]
