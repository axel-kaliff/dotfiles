[mgr]
sort_dir_first = true
show_symlink = true
linemode = "size"
scrolloff = 5

[plugin]
prepend_fetchers = [
  # git status column
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
  # mime by extension: skips the expensive `file` probe on known extensions
  { url = "local://*", run = "mime-ext.local", prio = "high", group = "mime" },
  { url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },
]

[preview]
max_width = 600
max_height = 900
image_filter = "lanczos3"
# Skip sending thumbnail data for files you scroll straight past.
image_delay = 100

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$0")"', for = "linux" },
]
play = [
  { run = 'mpv "$@"', orphan = true, for = "unix" },
]

[open]
prepend_rules = [
  { mime = "video/*", use = "play" },
  { mime = "audio/*", use = "play" },
  { url = "*.md", use = "edit" },
  { url = "*.json", use = "edit" },
  { url = "*.toml", use = "edit" },
  { url = "*.yaml", use = "edit" },
  { url = "*.yml", use = "edit" },
  { url = "*.kdl", use = "edit" },
  { url = "*.lua", use = "edit" },
  { url = "*.fish", use = "edit" },
  { url = "*.sh", use = "edit" },
]
