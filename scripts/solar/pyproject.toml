[project]
name = "solar-wallpaper"
version = "0.1.0"
description = "Day/night wallpaper, night light and theme from the sun's position, for Omarchy on pneuma"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "ANN", "B", "A", "C4", "C901", "SIM", "TCH", "RUF",
    "PT", "RET", "PTH", "S", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 4
max-branches = 8
max-statements = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
# S603 marks every subprocess call for audit. run_command resolves the
# executable with shutil.which and no argument comes from user input.
"solar_wallpaper.py" = ["S603"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unreachable = true
disallow_any_explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
