"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 500
scan_timeout = 30

add_newline = false

format = """
[╭─](peach)[](crust)[  ](fg:peach bg:crust)\
($username$hostname[ ](fg:peach bg:crust))\
($git_branch$git_status$git_state[](fg:peach bg:crust))\
($nodejs$python$rust$golang$java$lua$c$package[](fg:peach bg:crust))\
($docker_context$container$kubernetes$conda[](fg:peach bg:crust))\
($shlvl$sudo[](fg:peach bg:crust))\
$status\
[](crust)\
$line_break\
[╰─](peach)[](peach)\
$directory\
[](peach) \
$character"""

right_format = """$cmd_duration$jobs$time"""

palette = 'bonfire'

# ~~~~~~~~~~~~~~~~~~~~~~~~~  IDENTITY (red)  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[os]
disabled = true
style = "bg:crust fg:peach"
format = '[ $symbol ]($style)'

[os.symbols]
Macos = "󰀵"
Linux = "󰌽"
Fedora = "󰣛"
CentOS = "󰣛"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Ubuntu = "󰕈"
Arch = "󰣇"
Debian = "󰣚"
Alpine = ""
NixOS = ""
Manjaro = ""
Mint = "󰣭"
Pop = ""
Windows = ""

[username]
show_always = false
style_user = "bg:crust fg:peach"
style_root = "bg:crust fg:peach bold"
format = '[ $user]($style)'

[hostname]
ssh_only = true
ssh_symbol = " "
style = "bg:crust fg:peach"
format = '[ $ssh_symbol$hostname]($style)'

# ~~~~~~~~~~~~~~~~~~~~~~~~~  DIRECTORY (peach)  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[directory]
style = "bg:peach fg:crust"
format = '[ $path$read_only ]($style)'
truncation_length = 4
truncate_to_repo = true
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1
read_only = " 󰌾"
read_only_style = "bg:peach fg:crust"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Movies" = "󰿏 "
"Sources" = " "
"~" = " "

# ~~~~~~~~~~~~~~~~~~~~~~~~~  GIT (yellow)  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[git_branch]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $branch ](fg:green bg:crust)]($style)'
truncation_length = 24
truncation_symbol = "…"

[git_status]
disabled = false
style = "bg:crust"
format = '[[($all_status$ahead_behind )](fg:green bg:crust)]($style)'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
conflicted = "="
deleted = "✘"
renamed = "»"
modified = "!"
staged = "+"
untracked = "?"
stashed = "≡"

[git_state]
disabled = false
style = "bg:crust"
format = '[[\($state( $progress_current/$progress_total)\) ](fg:green bg:crust)]($style)'
rebase = "REBASE"
merge = "MERGE"
revert = "REVERT"
cherry_pick = "PICK"
bisect = "BISECT"
am = "AM"
am_or_rebase = "AM/REBASE"

# ~~~~~~~~~~~~~~~~~~~~~~~~~  LANGUAGES (green)  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[nodejs]
symbol = "󰎙"
style = "bg:crust"
format = '[[ $symbol $version ](fg:peach bg:crust)]($style)'

[python]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $version( \($virtualenv\)) ](fg:peach bg:crust)]($style)'
pyenv_version_name = false
python_binary = "python"

[rust]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $version ](fg:peach bg:crust)]($style)'

[golang]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $version ](fg:peach bg:crust)]($style)'

[java]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $version ](fg:peach bg:crust)]($style)'

[lua]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $version ](fg:peach bg:crust)]($style)'

[c]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $version ](fg:peach bg:crust)]($style)'

[package]
disabled = false
symbol = "󰏗"
style = "bg:crust"
format = '[[ $symbol $version ](fg:peach bg:crust)]($style)'
display_private = false

# ~~~~~~~~~~~~~~~~~~~~~~~~~  CONTEXT (sapphire)  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[docker_context]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $context ](fg:peach bg:crust)]($style)'
only_with_files = true

[container]
style = "bg:crust"
format = '[[ 󰡨 $name ](fg:peach bg:crust)]($style)'

[kubernetes]
disabled = false
symbol = "󱃾"
style = "bg:crust"
format = '[[ $symbol $context( \($namespace\)) ](fg:peach bg:crust)]($style)'

[conda]
symbol = ""
style = "bg:crust"
format = '[[ $symbol $environment ](fg:peach bg:crust)]($style)'
ignore_base = true

# ~~~~~~~~~~~~~~~~~~~~~~~~~  STATE (mauve)  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[shlvl]
disabled = false
threshold = 2
symbol = ""
style = "bg:crust"
format = '[[ $symbol $shlvl ](fg:peach bg:crust)]($style)'
repeat = false

[sudo]
disabled = false
symbol = ""
style = "bg:crust"
format = '[[ $symbol ](fg:peach bg:crust)]($style)'

# ~~~~~~~~~~~~~~~~~~~~~~~~~  RIGHT SIDE  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "fg:peach"
format = '[ took $duration ]($style)'
disabled = false
show_notifications = true
min_time_to_notify = 60000

[status]
disabled = false
style = "bg:crust fg:red"
success_style = "bg:crust fg:peach"
symbol = " YOU DIED"
success_symbol = ""
format = '[ $symbol ]($style)'
recognize_signal_code = true
map_symbol = false
pipestatus = true
pipestatus_format = '[ $symbol ]($style)'

[jobs]
disabled = false
threshold = 1
symbol_threshold = 1
number_threshold = 2
symbol = ""
style = "fg:yellow"
format = '[ $symbol $number ]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:lavender"
format = '[ 󰥔 $time ]($style)'

# ~~~~~~~~~~~~~~~~~~~~~~~~~  PROMPT  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# ~~~~~~~~~~~~~~~~~~~~~~~~~  PALETTE  ~~~~~~~~~~~~~~~~~~~~~~~~~ #
[palettes.bonfire]
red = "#e60000"
peach = "#fb7e14"
yellow = "#ffb000"
green = "#D4E157"
teal = "#c9a66b"
sky = "#e8c88a"
sapphire = "#d9822b"
blue = "#d9822b"
lavender = "#fb7e14"
mauve = "#b5503a"
pink = "#ff7a5c"
rosewater = "#e8dccb"
flamingo = "#f5ebdc"
maroon = "#e03a1e"
text = "#e8dccb"
subtext1 = "#d9cbb8"
subtext0 = "#c9a66b"
overlay2 = "#a3795f"
overlay1 = "#875f5f"
overlay0 = "#5a4a42"
surface2 = "#4a3026"
surface1 = "#38231b"
surface0 = "#1a0d08"
base = "#080808"
mantle = "#090909"
crust = "#292929"

# Nordfox (EdenEast/nightfox.nvim), matching the nvim, zellij and fish themes —
# the prompt was the odd one out on Catppuccin Mocha. The catppuccin key names
# are kept deliberately so every format string above works unchanged; only the
# values differ.
[palettes.nordfox]
# Accents
red = "#bf616a"
peach = "#c9826b"      # nordfox orange
yellow = "#ebcb8b"
green = "#a3be8c"
teal = "#8fbcbb"
sky = "#88c0d0"
sapphire = "#88c0d0"   # nordfox cyan
blue = "#81a1c1"
lavender = "#81a1c1"   # nordfox blue
mauve = "#b48ead"      # nordfox magenta
pink = "#bf88bc"
rosewater = "#d8dee9"
flamingo = "#e5e9f0"
maroon = "#b1626b"
# Text
text = "#cdcecf"       # fg1
subtext1 = "#abb1bb"   # fg2
subtext0 = "#8f96a3"
overlay2 = "#7b8494"
overlay1 = "#6b7688"
overlay0 = "#60728a"   # comment
# Surfaces (darkest last — `crust` is the text colour on the coloured bars)
surface2 = "#4c566a"
surface1 = "#444c5e"
surface0 = "#39404f"
base = "#2e3440"
mantle = "#2a2f3a"
crust = "#232831"
