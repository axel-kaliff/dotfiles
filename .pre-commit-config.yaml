# Covers commits made by hand (and by `udot`). The 15-minute sync timer commits
# with --no-verify and cannot use this, so it runs the same scan itself — see
# scripts/dotfiles-sync.sh. Both paths share .gitleaks.toml at the repo root.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
